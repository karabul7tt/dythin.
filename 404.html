<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sayfa Bulunamadı | Dythin.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0e0e1a;
      color: #f0f0f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 selection:bg-[#7F77DD] selection:text-white">
  <div class="max-w-md w-full text-center space-y-8 bg-[#161622] border border-[#1e1e2e] p-8 sm:p-12 rounded-3xl shadow-2xl relative overflow-hidden">
    <!-- Glow -->
    <div class="absolute -top-20 -left-20 w-48 h-48 bg-[#7F77DD]/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-48 h-48 bg-[#C9A84C]/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-20 h-20 mx-auto rounded-3xl bg-[#7F77DD]/15 border border-[#7F77DD]/40 text-[#7F77DD] flex items-center justify-center text-3xl font-extrabold shadow-inner">
      404
    </div>

    <div class="space-y-3">
      <h1 class="text-3xl font-extrabold text-white">Aradığınız Sayfa Bulunamadı</h1>
      <p class="text-sm text-[#888899] leading-relaxed">
        Tıkladığınız bağlantı geçmişte kalmış veya adresi değişmiş olabilir. Kararsız kalmayın, ana sayfaya dönün!
      </p>
    </div>

    <div class="pt-4">
      <a href="/" class="inline-flex items-center justify-center px-8 py-3.5 rounded-2xl bg-[#7F77DD] hover:bg-[#6a62c4] text-white font-bold text-sm transition transform hover:scale-105 shadow-xl">
        <i class="fa-solid fa-house mr-2"></i> Ana Sayfaya Dön
      </a>
    </div>
  </div>
</body>
</html>
